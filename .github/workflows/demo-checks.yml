name: Portfolio demo checks

on:
  push:
    paths:
      - 'demos/**'
      - 'index.html'
      - 'portfolio.js'
      - 'portfolio.css'
      - '.github/workflows/demo-checks.yml'
  pull_request:
    paths:
      - 'demos/**'
      - 'index.html'
      - 'portfolio.js'
      - 'portfolio.css'
      - '.github/workflows/demo-checks.yml'

permissions:
  contents: read

jobs:
  interactive-demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demos
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm run build && npm test
      - run: git diff --exit-code -- interactive.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Package the tested static site for local preview
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          retention-days: 7
          if-no-files-found: error
          path: |
            index.html
            portfolio.css
            portfolio.js
            resources.js
            support.js
            vendor/
            assets/
            media/
            Zhangruopan-AI-Homepage-Bookline-v2.mp4
            zhangruopan-cv.pdf
            demos/demos.css
            demos/loader.js
            demos/interactive.js
            demos/illustrations.js
